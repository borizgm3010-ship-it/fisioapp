<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="theme-color" content="#0f766e">
<title>Inventario Ortopedia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#14211f;--mut:#62716e;--ln:#e1e8e6;--pri:#0f766e;--onpri:#fff;--pri2:#e3f3f0;--warn:#a85a06;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fde2e2;--ok:#15803d;--okbg:#dcfce7}
@media (prefers-color-scheme:dark){:root{--bg:#0d1413;--card:#162120;--tx:#e7efed;--mut:#9aaaa6;--ln:#26332f;--pri:#2dd4bf;--onpri:#04201c;--pri2:#11302c;--warn:#fbbf24;--warnbg:#3a2a07;--bad:#f87171;--badbg:#3a1414;--ok:#4ade80;--okbg:#0f2c1b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);font-size:16px}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
button{cursor:pointer;border:0;background:none}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--pri);color:var(--onpri);font-weight:600;font-size:16px;margin-top:16px}
.btn:disabled{opacity:.55}
.btn2{display:block;width:100%;padding:12px;border-radius:14px;background:var(--pri2);color:var(--pri);font-weight:600;margin-top:10px}
.btnr{color:var(--bad);background:var(--badbg)}
.muted{color:var(--mut);font-size:14px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--pri);color:var(--onpri)}
.ttl{font-weight:700;font-size:19px}.sub{font-size:13px;opacity:.85}
.back{color:var(--onpri);text-decoration:none;font-size:14px;border:1px solid currentColor;border-radius:999px;padding:5px 12px;opacity:.9}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 0 9px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:21px}
.tabs button.on{color:var(--pri);font-weight:600}
.alerta{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--warnbg);color:var(--warn);font-weight:600;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 12px;padding-bottom:2px}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--ln);font-size:14px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border-radius:16px;overflow:hidden;text-align:left;border:1px solid var(--ln);display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:9px 10px 10px}
.cn{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.price{font-size:14px;font-weight:600}
.stk{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.stk.bajo{background:var(--warnbg);color:var(--warn)}
.stk.agotado{background:var(--badbg);color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;background:var(--pri);color:var(--onpri);border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:16px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px;border-radius:14px;background:var(--card);border:1px solid var(--ln);margin-bottom:8px}
.pick.sel{border-color:var(--pri);background:var(--pri2)}
.pick.dis{opacity:.45}
.th{width:46px;height:46px;border-radius:10px;background:var(--pri2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.th img{width:100%;height:100%;object-fit:cover}
.pi{flex:1;min-width:0}.pi b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi small{color:var(--mut)}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.modal[hidden]{display:none}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--ln);background:var(--card)}
.mhead b{font-size:17px}
.x{font-size:16px;padding:6px 10px;color:var(--pri);font-weight:600}
.mbody{flex:1;overflow-y:auto;padding:14px 16px calc(30px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
.bigph{width:100%;aspect-ratio:4/3;border-radius:18px;background:var(--pri2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:70px}
.bigph img{width:100%;height:100%;object-fit:contain;background:#fff}
h2{margin:14px 0 2px;font-size:22px}
.bigstock{display:flex;align-items:baseline;gap:8px;margin:12px 0;padding:14px;border-radius:16px;background:var(--okbg);color:var(--ok)}
.bigstock b{font-size:38px;line-height:1}
.bigstock.bajo{background:var(--warnbg);color:var(--warn)}
.bigstock.agotado{background:var(--badbg);color:var(--bad)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
.kv:last-child{border:0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.acts button{padding:12px 4px;border-radius:14px;background:var(--pri2);color:var(--pri);font-weight:600;font-size:15px}
.acts button.main{background:var(--pri);color:var(--onpri)}
.mov{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.mov:last-child{border:0}
.mq{min-width:50px;text-align:center;font-weight:700;border-radius:10px;padding:4px 6px;font-size:15px}
.mq.compra{background:var(--okbg);color:var(--ok)}.mq.venta{background:var(--pri2);color:var(--pri)}.mq.ajuste{background:var(--warnbg);color:var(--warn)}
.mi{flex:1;min-width:0;font-size:14px}.mi b{font-weight:600}
.anul{font-size:13px;color:var(--bad);padding:4px 6px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:48px;height:48px;border-radius:14px;background:var(--pri2);color:var(--pri);font-size:24px;font-weight:700;flex:none}
.step input{text-align:center;font-size:20px;font-weight:700}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow2{border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--card)}
.crow2 .hd{display:flex;align-items:center;gap:10px}
.crow2 label{margin-top:8px}
.del{color:var(--bad);font-size:20px;padding:4px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}
.stat small{color:var(--mut);font-size:13px;display:block}.stat b{font-size:20px}
.warnline{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin-top:8px}
.login{max-width:380px;margin:0 auto;padding:calc(50px + env(safe-area-inset-top)) 20px 30px}
.login h1{margin:0 0 4px;font-size:26px}
.fotopick{display:flex;gap:12px;align-items:center}
.fotopick .bigph{width:110px;height:110px;aspect-ratio:auto;font-size:40px;flex:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:40;text-align:center;pointer-events:none}
#toast div{display:inline-block;background:#14211f;color:#fff;padding:11px 16px;border-radius:14px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast div.err{background:#b91c1c}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty div{font-size:46px}
.cmp{display:flex;justify-content:space-between;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--ln)}
</style>
</head>
<body>
<div id="app"><div class="empty"><div>📦</div>Cargando…</div></div>
<script>
var SUPABASE_URL = 'https://xzqromdcaeclsdiajcdz.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6cXJvbWRjYWVjbHNkaWFqY2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTY5MDYsImV4cCI6MjEwNzk5MjkwNn0.6csjnGseODDO_4_EhWGDD8l7LLWDo-AZoW9MofHaSnk';
var SEDE_NOMBRE = 'Curva de Manchay';
var METODOS = ['Efectivo', 'Yape', 'Plin', 'Tarjeta', 'Transferencia'];

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var S = { user: null, perfil: null, sede: null, productos: [], tab: 'productos', filtro: 'todos', q: '', qv: '', ventaProd: null, ventaCant: 1, ventaMetodo: 'Efectivo', periodo: 'mes', compra: { items: [], proveedor: '', fecha: '', nota: '' } };
var app = document.getElementById('app');

// ---------- utilidades ----------
function $(s) { return document.querySelector(s); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function soles(n) { return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function ent(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
function hoyLima() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Lima' }).format(new Date()); }
function inicioDia(ymd) { return ymd + 'T00:00:00-05:00'; }
function fmtFecha(iso) { return new Date(iso).toLocaleString('es-PE', { timeZone: 'America/Lima', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function fmtDia(ymd) { return new Date(ymd + 'T12:00:00-05:00').toLocaleDateString('es-PE', { timeZone: 'America/Lima', day: 'numeric', month: 'short', year: 'numeric' }); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function fotoUrl(p) { return p ? sb.storage.from('inventario').getPublicUrl(p).data.publicUrl : ''; }
function canEdit() { return S.perfil && (S.perfil.rol === 'admin' || S.perfil.rol === 'recepcion'); }
function isAdmin() { return S.perfil && S.perfil.rol === 'admin'; }
function prod(id) { return S.productos.find(function (p) { return p.id === id; }); }
function estado(p) { if (p.stock <= 0) return 'agotado'; if (p.stock <= p.stock_minimo) return 'bajo'; return 'ok'; }
function coincide(p, q) { q = norm(q); return !q || norm(p.nombre + ' ' + (p.variante || '') + ' ' + (p.categoria || '')).indexOf(q) >= 0; }
function thumb(p) { return '<div class="th">' + (p && p.foto_path ? '<img loading="lazy" src="' + esc(fotoUrl(p.foto_path)) + '" alt="">' : '🦿') + '</div>'; }
function errMsg(e) { var m = (e && (e.message || e.error_description)) || String(e); return m.replace(/^.*?ERROR:\s*/, ''); }
var toastT;
function toast(msg, err) { var t = document.getElementById('toast'); if (!t) return; t.innerHTML = '<div class="' + (err ? 'err' : '') + '">' + esc(msg) + '</div>'; clearTimeout(toastT); toastT = setTimeout(function () { t.innerHTML = ''; }, err ? 4500 : 2500); }
function ocupado(btn, si, txt) { if (!btn) return; if (si) { btn.dataset.t = btn.textContent; btn.textContent = txt || 'Guardando…'; btn.disabled = true; } else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; } }
function guardarBorrador() { try { localStorage.setItem('inv_compra', JSON.stringify(S.compra)); } catch (e) {} }
function leerBorrador() { try { var c = JSON.parse(localStorage.getItem('inv_compra') || 'null'); if (c && Array.isArray(c.items)) S.compra = c; } catch (e) {} }

// ---------- inicio ----------
async function init() {
  var r = await sb.auth.getSession();
  if (!r.data.session) { renderLogin(); return; }
  S.user = r.data.session.user;
  var p = await sb.from('perfiles').select('id,nombre,rol,centro_id,activo').eq('id', S.user.id).maybeSingle();
  if (p.error || !p.data || !p.data.activo) {
    app.innerHTML = '<div class="login"><h1>Sin acceso</h1><p class="muted">Tu usuario todavía no pertenece a un centro o está desactivado. Entra primero a FisioApp.</p><a class="btn" style="text-align:center;text-decoration:none" href="./">Ir a FisioApp</a><button class="btn2" onclick="salir()">Cerrar sesión</button></div>';
    return;
  }
  S.perfil = p.data;
  var s = await sb.from('sedes').select('id,nombre').eq('nombre', SEDE_NOMBRE).maybeSingle();
  if (!s.data) s = await sb.from('sedes').select('id,nombre').ilike('nombre', '%manchay%').limit(1).maybeSingle();
  if (!s.data) { app.innerHTML = '<div class="login"><h1>Falta el local</h1><p class="muted">No encontré el local "' + esc(SEDE_NOMBRE) + '".</p></div>'; return; }
  S.sede = s.data;
  leerBorrador();
  if (!S.compra.fecha) S.compra.fecha = hoyLima();
  renderShell();
  await cargarProductos();
  go(S.tab);
}
async function salir() { await sb.auth.signOut(); location.reload(); }

function renderLogin() {
  app.innerHTML = '<div class="login"><h1>Inventario</h1><p class="muted">Usa el mismo correo y contraseña de FisioApp.</p>' +
    '<form id="lf"><label>Correo</label><input id="le" type="email" autocomplete="username" required>' +
    '<label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" required>' +
    '<button class="btn" id="lb">Entrar</button></form></div><div id="toast"></div>';
  $('#lf').onsubmit = async function (e) {
    e.preventDefault(); var b = $('#lb'); ocupado(b, true, 'Entrando…');
    var r = await sb.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value });
    if (r.error) { ocupado(b, false); toast('Correo o contraseña incorrectos', 1); return; }
    init();
  };
}

function renderShell() {
  app.innerHTML = '<header class="top"><div><div class="ttl">Inventario</div><div class="sub">' + esc(S.sede.nombre) + ' · ' + esc(S.perfil.nombre || '') + '</div></div><a class="back" href="./">FisioApp</a></header>' +
    '<main id="view"></main>' +
    '<nav class="tabs">' +
    [['productos', '📦', 'Productos'], ['vender', '🛒', 'Vender'], ['reponer', '🚚', 'Reponer'], ['resumen', '📊', 'Resumen']].map(function (t) {
      return '<button data-tab="' + t[0] + '" onclick="go(\'' + t[0] + '\')"><span>' + t[1] + '</span>' + t[2] + '</button>';
    }).join('') + '</nav><div id="modal" class="modal" hidden></div><div id="toast"></div>';
}

function go(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  window.scrollTo(0, 0);
  if (tab === 'productos') renderProductos();
  else if (tab === 'vender') renderVender();
  else if (tab === 'reponer') renderReponer();
  else renderResumen();
}

async function cargarProductos() {
  var r = await sb.from('productos').select('*').eq('sede_id', S.sede.id).eq('activo', true).order('nombre');
  if (r.error) { toast(errMsg(r.error), 1); return; }
  S.productos = r.data || [];
}

// ---------- modal ----------
function abrirModal(titulo, cuerpo, derecha) {
  var m = $('#modal');
  m.innerHTML = '<div class="mhead"><button class="x" onclick="cerrarModal()">Cerrar</button><b>' + esc(titulo) + '</b><span style="min-width:60px;text-align:right">' + (derecha || '') + '</span></div><div class="mbody">' + cuerpo + '</div>';
  m.hidden = false; document.body.style.overflow = 'hidden';
}
function cerrarModal() { var m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; }

// ---------- PRODUCTOS ----------
function renderProductos() {
  var bajos = S.productos.filter(function (p) { return estado(p) !== 'ok'; }).length;
  var ag = S.productos.filter(function (p) { return estado(p) === 'agotado'; }).length;
  var h = '';
  if (bajos) h += '<button class="alerta" onclick="setFiltro(\'alerta\')">⚠️ ' + bajos + (bajos === 1 ? ' producto' : ' productos') + ' por acabarse o agotado' + (bajos === 1 ? '' : 's') + '</button>';
  h += '<input id="q" type="search" placeholder="Buscar producto, talla o categoría" value="' + esc(S.q) + '">';
  h += '<div class="chips">' +
    chip('todos', 'Todos (' + S.productos.length + ')') + chip('alerta', 'Por acabarse (' + bajos + ')') + chip('agotado', 'Agotados (' + ag + ')') + '</div>';
  h += '<div id="grid"></div>';
  if (canEdit()) h += '<button class="fab" onclick="formProducto()">＋ Producto</button>';
  $('#view').innerHTML = h;
  $('#q').oninput = function () { S.q = this.value; renderGrid(); };
  renderGrid();
}
function chip(f, t) { return '<button class="chip ' + (S.filtro === f ? 'on' : '') + '" onclick="setFiltro(\'' + f + '\')">' + t + '</button>'; }
function setFiltro(f) { S.filtro = f; renderProductos(); }
function renderGrid() {
  var arr = S.productos.filter(function (p) {
    if (S.filtro === 'alerta' && estado(p) === 'ok') return false;
    if (S.filtro === 'agotado' && estado(p) !== 'agotado') return false;
    return coincide(p, S.q);
  });
  var g = $('#grid'); if (!g) return;
  if (!S.productos.length) { g.innerHTML = '<div class="empty"><div>🦿</div>Aún no hay productos.' + (canEdit() ? '<br>Toca <b>＋ Producto</b> para agregar el primero con su foto.' : '') + '</div>'; return; }
  if (!arr.length) { g.innerHTML = '<p class="muted">No hay productos con ese filtro.</p>'; return; }
  g.className = 'grid';
  g.innerHTML = arr.map(function (p) {
    var e = estado(p);
    return '<button class="card" onclick="verProducto(\'' + p.id + '\')"><div class="ph">' + (p.foto_path ? '<img loading="lazy" src="' + esc(fotoUrl(p.foto_path)) + '" alt="">' : '🦿') + '</div>' +
      '<div class="cb"><div class="cn">' + esc(p.nombre) + '</div><div class="cv">' + esc(p.variante || p.categoria || '') + '</div>' +
      '<div class="crow"><span class="price">' + soles(p.precio_venta) + '</span><span class="stk ' + e + '">' + (e === 'agotado' ? 'Agotado' : p.stock + ' u.') + '</span></div></div></button>';
  }).join('');
}

function movHtml(m, conProd) {
  var t = m.tipo, q = m.cantidad, txt;
  if (t === 'compra') txt = '<b>Compra</b>' + (m.precio_unit ? ' · ' + soles(m.precio_unit) + ' c/u' : '');
  else if (t === 'venta') txt = '<b>Venta ' + soles(m.total) + '</b>' + (m.metodo ? ' · ' + esc(m.metodo) : '');
  else txt = '<b>Conteo</b> (quedaron ' + m.stock_resultante + ')';
  var pr = conProd && m.productos ? '<div>' + esc(m.productos.nombre) + (m.productos.variante ? ' · ' + esc(m.productos.variante) : '') + '</div>' : '';
  return '<div class="mov"><div class="mq ' + t + '">' + (q > 0 ? '+' : '−') + Math.abs(q) + '</div><div class="mi">' + pr + txt +
    (m.nota ? '<div class="muted">' + esc(m.nota) + '</div>' : '') +
    '<div class="muted">' + fmtFecha(m.creado_en) + (m.perfiles && m.perfiles.nombre ? ' · ' + esc(m.perfiles.nombre) : '') + '</div></div>' +
    (isAdmin() ? '<button class="anul" onclick="anular(\'' + m.id + '\',\'' + m.producto_id + '\')">Anular</button>' : '') + '</div>';
}

async function verProducto(id) {
  var p = prod(id); if (!p) return;
  var e = estado(p);

function comprimir(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var max = 900, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('No se pudo procesar la foto')); }, 'image/jpeg', 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(u); rej(new Error('No se pudo leer esa foto. Prueba con otra.')); };
    img.src = u;
  });
}
async function guardarProducto(id, desdeCompra) {

  S.compra = { items: [], proveedor: '', fecha: hoyLima(), nota: '' }; guardarBorrador();
  toast('Compra guardada: +' + u + ' unidades');
  await cargarProductos(); renderReponer();
}
async function verCompra(id) {
  abrirModal('Compra', '<div id="vcx" class="muted">Cargando…</div>');
  var c = await sb.from('compras_inventario').select('*,perfiles(nombre)').eq('id', id).single();
  var m = await sb.from('movimientos_inventario').select('*,productos(nombre,variante,foto_path),perfiles(nombre)').eq('compra_id', id).order('creado_en');
  var b = $('#vcx'); if (!b) return;
  if (c.error) { b.textContent = errMsg(c.error); return; }
  b.className = '';
  b.innerHTML = '<div class="box"><div class="kv"><span>Fecha</span><b>' + fmtDia(c.data.fecha) + '</b></div><div class="kv"><span>Proveedor</span><b>' + esc(c.data.proveedor || '—') + '</b></div>' +
    (c.data.nota ? '<div class="kv"><span>Nota</span><b>' + esc(c.data.nota) + '</b></div>' : '') +
    '<div class="kv"><span>Registró</span><b>' + esc(c.data.perfiles ? c.data.perfiles.nombre : '—') + '</b></div><div class="kv"><span>Total</span><b>' + soles(c.data.total) + '</b></div></div>' +
    '<div class="box"><h3>Productos</h3>' + (m.data || []).map(function (x) {
      return '<div class="mov">' + thumb(x.productos) + '<div class="mi"><b>' + esc(x.productos ? x.productos.nombre : '') + '</b>' + (x.productos && x.productos.variante ? ' · ' + esc(x.productos.variante) : '') +
        '<div class="muted">' + x.cantidad + ' u. × ' + soles(x.precio_unit) + ' = ' + soles(x.total) + '</div></div>' +
        (isAdmin() ? '<button class="anul" onclick="anularDeCompra(\'' + x.id + '\',\'' + id + '\')">Anular</button>' : '') + '</div>';
    }).join('') + '</div>';
}
async function anularDeCompra(movId, compraId) {
  if (!confirm('¿Anular este producto de la compra? Se restarán sus unidades del stock.')) return;
  var r = await sb.rpc('anular_movimiento', { p_id: movId });
  if (r.error) { toast(errMsg(r.error), 1); return; }
  toast('Anulado'); await cargarProductos(); verCompra(compraId); if (S.tab === 'reponer') renderReponer();
}

// ---------- RESUMEN ----------
function rango() {
  var hoy = hoyLima(), y = +hoy.slice(0, 4), mo = +hoy.slice(5, 7), ini, fin = null;
  if (S.periodo === 'hoy') ini = inicioDia(hoy);
  else if (S.periodo === '15') ini = new Date(new Date(inicioDia(hoy)).getTime() - 14 * 864e5).toISOString();
  else if (S.periodo === 'mes') ini = inicioDia(hoy.slice(0, 8) + '01');
  else {
    var py = mo === 1 ? y - 1 : y, pm = mo === 1 ? 12 : mo - 1;
    ini = inicioDia(py + '-' + String(pm).padStart(2, '0') + '-01'); fin = inicioDia(hoy.slice(0, 8) + '01');
  }
  return { ini: ini, fin: fin };
}
async function renderResumen() {
  var per = [['hoy', 'Hoy'], ['15', 'Últimos 15 días'], ['mes', 'Este mes'], ['ant', 'Mes anterior']];
  var h = '<div class="chips">' + per.map(function (x) { return '<button class="chip ' + (S.periodo === x[0] ? 'on' : '') + '" onclick="S.periodo=\'' + x[0] + '\';renderResumen()">' + x[1] + '</button>'; }).join('') + '</div><div id="rs" class="muted">Calculando…</div>';
  $('#view').innerHTML = h;
  var rg = rango();
  var q = sb.from('movimientos_inventario').select('*,productos(nombre,variante,costo),perfiles(nombre)').eq('sede_id', S.sede.id).gte('creado_en', rg.ini).order('creado_en', { ascending: false }).limit(3000);
  if (rg.fin) q = q.lt('creado_en', rg.fin);
  var r = await q; var box = $('#rs'); if (!box) return;
  if (r.error) { box.textContent = errMsg(r.error); return; }
  var d = r.data || [], ventas = 0, unid = 0, costoV = 0, compras = 0, met = {}, top = {};
  d.forEach(function (m) {
    if (m.tipo === 'venta') {
      var c = Math.abs(m.cantidad); ventas += Number(m.total || 0); unid += c;
      costoV += c * Number(m.productos ? m.productos.costo : 0);
      var k = m.metodo || 'Sin indicar'; met[k] = (met[k] || 0) + Number(m.total || 0);
      var n = m.productos ? m.productos.nombre + (m.productos.variante ? ' · ' + m.productos.variante : '') : '—';
      top[n] = top[n] || { u: 0, s: 0 }; top[n].u += c; top[n].s += Number(m.total || 0);
    } else if (m.tipo === 'compra') compras += Number(m.total || 0);
  });
  var stockU = 0, valCosto = 0, valVenta = 0;
  S.productos.forEach(function (p) { stockU += p.stock; valCosto += p.stock * Number(p.costo); valVenta += p.stock * Number(p.precio_venta); });
  var bajos = S.productos.filter(function (p) { return estado(p) !== 'ok'; }).sort(function (a, b) { return a.stock - b.stock; });
  var hh = '<div class="stats"><div class="stat"><small>Ventas</small><b>' + soles(ventas) + '</b></div><div class="stat"><small>Unidades vendidas</small><b>' + unid + '</b></div>';
  if (canEdit()) hh += '<div class="stat"><small>Ganancia aprox.</small><b>' + soles(ventas - costoV) + '</b></div><div class="stat"><small>Compras</small><b>' + soles(compras) + '</b></div>';
  hh += '</div>';
  var tl = Object.keys(top).sort(function (a, b) { return top[b].u - top[a].u; }).slice(0, 5);
  if (tl.length) hh += '<div class="box"><h3>Más vendidos</h3>' + tl.map(function (k) { return '<div class="kv"><span>' + esc(k) + '</span><b>' + top[k].u + ' u. · ' + soles(top[k].s) + '</b></div>'; }).join('') + '</div>';
  var ml = Object.keys(met);
  if (ml.length) hh += '<div class="box"><h3>Por forma de pago</h3>' + ml.map(function (k) { return '<div class="kv"><span>' + esc(k) + '</span><b>' + soles(met[k]) + '</b></div>'; }).join('') + '</div>';
  hh += '<div class="box"><h3>Inventario actual</h3><div class="kv"><span>Productos</span><b>' + S.productos.length + '</b></div><div class="kv"><span>Unidades en total</span><b>' + stockU + '</b></div>' +
    (canEdit() ? '<div class="kv"><span>Valor a costo</span><b>' + soles(valCosto) + '</b></div>' : '') + '<div class="kv"><span>Valor a precio de venta</span><b>' + soles(valVenta) + '</b></div></div>';
  if (bajos.length) hh += '<div class="box"><h3>Por reponer</h3>' + bajos.map(function (p) { return '<button class="pick" onclick="verProducto(\'' + p.id + '\')">' + thumb(p) + '<div class="pi"><b>' + esc(p.nombre) + '</b><small>' + esc(p.variante || '') + ' · mínimo ' + p.stock_minimo + '</small></div><span class="stk ' + estado(p) + '">' + p.stock + '</span></button>'; }).join('') + '</div>';
  hh += '<div class="box"><h3>Movimientos del periodo</h3>' + (d.length ? d.slice(0, 60).map(function (m) { return movHtml(m, true); }).join('') : '<p class="muted">Sin movimientos en este periodo.</p>') + '</div>';
  if (canEdit()) hh += '<p class="muted">La ganancia se calcula con el costo actual de cada producto.</p>';
  box.className = ''; box.innerHTML = hh;
}

sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') location.reload(); });
init().catch(function (e) { app.innerHTML = '<div class="login"><h1>Error</h1><p class="muted">' + esc(errMsg(e)) + '</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'; });
</script>
